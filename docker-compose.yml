services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      SPORTSWORLD_ENV: demo
      STORE_BACKEND: memory
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    depends_on: [backend]
    ports: ["5173:80"]
